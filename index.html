<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Раскоп</title>
<style>
/* Раскоп: тёмное стекло на чёрном (экономия OLED). Акцент меняется с каждым слоем через --h. */
@property --h { syntax: '<number>'; inherits: true; initial-value: 96; }
:root {
  --h: 96;
  --bg: #05060b;
  --ink: #eef1f8;
  --ink2: #a3abc0;
  --ink3: #646d83;
  --line: rgba(255,255,255,.11);
  --line2: rgba(255,255,255,.24);
  --glass-a: rgba(255,255,255,.085);
  --glass-b: rgba(255,255,255,.026);
  --acc: hsl(var(--h) 88% 64%);
  --acc-deep: hsl(var(--h) 80% 42%);
  --acc-soft: hsl(var(--h) 88% 64% / .16);
  --good: #7ee8a8;
  --bad: #ff8294;
  --gold: #ffd36b;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
  transition: --h 1.4s ease;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 500 15px/1.35 var(--font);
  overflow: hidden; overscroll-behavior: none;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
textarea { font: 12px/1.3 ui-monospace, Menlo, Consolas, monospace; color: var(--ink); user-select: text; -webkit-user-select: text; }
b { font-weight: 800; }
[hidden] { display: none !important; }
.mut { color: var(--ink2); }
.num { font-variant-numeric: tabular-nums; }

#aura {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(70% 42% at 12% 6%, hsl(var(--h) 90% 55% / .24), transparent 72%),
    radial-gradient(60% 42% at 92% 96%, hsl(calc(var(--h) + 50) 90% 50% / .17), transparent 72%),
    radial-gradient(40% 28% at 88% 32%, hsl(calc(var(--h) - 45) 80% 50% / .09), transparent 72%);
}
#app {
  position: relative; z-index: 1; height: 100%; max-width: 540px; margin: 0 auto;
  padding-inline: 16px; padding-block: 10px 0;
  display: flex; flex-direction: column; gap: 10px;
}

.glass, .card {
  background: linear-gradient(155deg, var(--glass-a), var(--glass-b));
  border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 12px 28px rgba(0,0,0,.34);
  border-radius: 20px;
}
.glass { -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%); }
.eco .glass { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(22,24,34,.92); }
.eco #aura { opacity: .55; }
.card { padding: 12px 14px; }

/* HUD */
.hud { padding: 12px 16px 10px; flex: none; }
.hud-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.stat { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.stat.r { text-align: right; align-items: flex-end; }
.lbl { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); font-weight: 700; }
.stat b { font-size: 28px; line-height: 1.05; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
#coins { color: var(--gold); text-shadow: 0 0 22px rgba(255,211,107,.28); }
.layerbar { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-size: 12px; min-width: 0; }
.layerbar .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 12px var(--acc); flex: none; }
#layerName { font-weight: 800; white-space: nowrap; }
#layerNext { white-space: nowrap; color: var(--ink3); font-variant-numeric: tabular-nums; }
.layerbar .bar { flex: 1; min-width: 24px; }
.buffs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.buffs:empty { display: none; }
.pill { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 99px; background: var(--acc-soft); border: 1px solid hsl(var(--h) 88% 64% / .4); color: var(--acc); font-variant-numeric: tabular-nums; }

.bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; transform-origin: left center; transform: scaleX(0); border-radius: 99px;
  background: linear-gradient(90deg, hsl(var(--h) 88% 52%), hsl(calc(var(--h) + 30) 92% 68%)); }
.bar.big { height: 14px; }

/* views */
#views { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
.view { display: none; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding-bottom: 6px; scrollbar-width: none; }
.view::-webkit-scrollbar { display: none; }
.view.on { display: flex; flex-direction: column; gap: 10px; }
#v-dig { overflow: hidden; }

/* stage */
.stage { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; cursor: pointer; touch-action: manipulation; }
.blockwrap { position: relative; flex: none; will-change: transform; }
#block { display: block; width: 100%; height: 100%; }
#fx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
.hpwrap { width: min(100%, 340px); flex: none; pointer-events: none; }
.hprow { display: flex; justify-content: space-between; gap: 8px; margin-top: 5px; font-size: 12px; font-variant-numeric: tabular-nums; }
.quip { font-size: 12.5px; color: var(--ink3); text-align: center; min-height: 2.7em; max-width: 30ch; pointer-events: none; text-wrap: balance; }
.hint { position: absolute; top: 4px; left: 0; right: 0; text-align: center; color: var(--acc); font-weight: 700; font-size: 14px; pointer-events: none; text-wrap: balance; }
.fl { position: absolute; z-index: 4; pointer-events: none; font-weight: 800; font-size: 20px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.7); font-variant-numeric: tabular-nums; white-space: nowrap; will-change: transform, opacity; }
.fl.crit { color: var(--gold); font-size: 27px; text-shadow: 0 0 16px rgba(255,211,107,.6), 0 2px 10px rgba(0,0,0,.7); }
.vein { position: absolute; z-index: 6; width: 78px; height: 78px; margin: -39px 0 0 -39px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #fff6c7, #ffd36b 40%, #c98a12 100%); box-shadow: 0 0 0 6px rgba(255,211,107,.18), 0 0 34px rgba(255,211,107,.7);
  color: #4a3000; font-weight: 900; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; text-align: center; line-height: 1.1;
  animation: vein 1s ease-in-out infinite alternate; }
@keyframes vein { from { transform: scale(.94); } to { transform: scale(1.06); } }

.chips { display: flex; gap: 8px; flex: none; }
.chip { flex: 1; min-width: 0; padding: 8px 10px; text-align: center; border-radius: 14px; }
.chip b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.advice { flex: none; padding: 10px 12px; display: flex; align-items: center; gap: 12px; }
.advice .info { flex: 1; min-width: 0; }
.advice .t { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.advice .bar { margin-top: 6px; height: 6px; }

/* rows */
.row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 12px; }
.row .ico { width: 48px; height: 48px; }
.row .t { font-weight: 800; overflow-wrap: anywhere; }
.row .s { font-size: 12.5px; color: var(--ink2); overflow-wrap: anywhere; }
.row .s2 { font-size: 12px; color: var(--ink3); font-variant-numeric: tabular-nums; }
.row.off { opacity: .55; }
.row.lock .t { color: var(--ink3); }
.glyph { width: 100%; height: 100%; display: block; }
.buy { min-width: 92px; min-height: 46px; padding: 5px 12px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(255,255,255,.05); border: 1px solid var(--line2); color: var(--ink3); transition: transform .08s; }
.buy small { font-size: 11px; font-weight: 700; letter-spacing: .04em; opacity: .9; }
.buy b { font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.buy.can { background: linear-gradient(180deg, hsl(var(--h) 88% 62%), hsl(var(--h) 80% 44%)); color: #05070c; border-color: transparent; box-shadow: 0 6px 18px hsl(var(--h) 90% 50% / .38), inset 0 1px 0 rgba(255,255,255,.4); }
.buy.can:active { transform: scale(.95); }
.buy.max { border-style: dashed; }
.buy.gem.can { background: linear-gradient(180deg, #d6b8ff, #8a5cf0); box-shadow: 0 6px 18px rgba(138,92,240,.4), inset 0 1px 0 rgba(255,255,255,.45); }
.sect { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); font-weight: 700; padding: 6px 4px 0; display: flex; justify-content: space-between; gap: 8px; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 16px; flex: none; }
.seg button { flex: 1; padding: 8px 4px; border-radius: 12px; font-weight: 800; font-size: 13px; color: var(--ink2); min-height: 38px; }
.seg button.on { background: var(--acc-soft); color: var(--acc); box-shadow: inset 0 0 0 1px hsl(var(--h) 88% 64% / .4); }
.note { font-size: 13px; color: var(--ink2); }
.note b { color: var(--ink); }

/* finds */
.fgroup { padding: 10px 12px 6px; }
.fgroup h3 { margin: 0 0 4px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.fgroup h3 span { font-size: 12px; color: var(--ink3); font-weight: 700; }
.find { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 4px 0; border-top: 1px solid rgba(255,255,255,.05); }
.find .ico { width: 34px; height: 34px; }
.find .n { font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }
.find .r { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; font-weight: 700; }
.find .c { font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.find.no .n { color: var(--ink3); }
.find.no .ico { opacity: .35; filter: grayscale(1); }
.find.leg .ico { filter: drop-shadow(0 0 7px hsl(40 95% 60% / .7)); }
.find.epic .ico { filter: drop-shadow(0 0 6px hsl(280 80% 62% / .6)); }

/* achievements, stats */
.ach { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 10px; align-items: center; padding: 8px 12px; }
.ach .ck { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 1px dashed var(--line2); color: transparent; font-weight: 900; }
.ach.done .ck { background: var(--acc-soft); border: 1px solid var(--acc); color: var(--acc); }
.ach .t { font-weight: 800; }
.ach .s { font-size: 12.5px; color: var(--ink2); }
.ach:not(.done) .t { color: var(--ink2); }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-top: 1px solid rgba(255,255,255,.05); font-size: 14px; }
.kv:first-child { border-top: 0; }
.kv span:last-child { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 6px 0; min-height: 44px; }
.toggle .sw { width: 46px; height: 28px; border-radius: 99px; background: rgba(255,255,255,.1); border: 1px solid var(--line2); position: relative; flex: none; transition: background .15s; }
.toggle .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle.on .sw { background: var(--acc-deep); border-color: transparent; }
.toggle.on .sw::after { transform: translateX(18px); }
.btn2 { min-height: 44px; padding: 8px 16px; border-radius: 14px; border: 1px solid var(--line2); background: rgba(255,255,255,.06); font-weight: 800; }
.btn2.pri { background: linear-gradient(180deg, hsl(var(--h) 88% 62%), hsl(var(--h) 80% 44%)); color: #05070c; border-color: transparent; }
.btn2.danger { color: var(--bad); border-color: rgba(255,130,148,.4); }
.btn2:disabled { opacity: .4; cursor: default; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
textarea { width: 100%; min-height: 70px; border-radius: 12px; border: 1px solid var(--line2); background: rgba(0,0,0,.35); padding: 8px; resize: vertical; }

/* tabs */
#tabs { flex: none; display: flex; padding: 6px; gap: 2px; margin-bottom: 10px; border-radius: 22px; }
#tabs button { flex: 1; min-width: 0; min-height: 54px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink3); font-size: 11px; font-weight: 800; position: relative; }
#tabs svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#tabs button.on { color: var(--acc); background: var(--acc-soft); box-shadow: inset 0 0 0 1px hsl(var(--h) 88% 64% / .35); }
#tabs .badge { position: absolute; top: 6px; right: calc(50% - 20px); width: 9px; height: 9px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); }

/* toasts, modal */
#toasts { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 128px); z-index: 30; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding-inline: 16px; }
.toast { max-width: 460px; width: 100%; padding: 10px 14px; border-radius: 16px; display: flex; gap: 10px; align-items: center; font-size: 14px;
  background: linear-gradient(155deg, rgba(40,44,62,.88), rgba(14,16,26,.9)); border: 1px solid var(--line2); box-shadow: 0 12px 32px rgba(0,0,0,.5); animation: tin .25s ease-out; }
.toast .ico { width: 34px; height: 34px; flex: none; }
.toast b { display: block; }
.toast .s { font-size: 12.5px; color: var(--ink2); }
.toast.big { padding: 14px 16px; border-color: hsl(var(--h) 88% 64% / .55); box-shadow: 0 0 40px hsl(var(--h) 90% 55% / .3), 0 12px 32px rgba(0,0,0,.5); }
.toast.big b { font-size: 18px; }
.toast.out { opacity: 0; transform: translateY(-8px); transition: opacity .35s, transform .35s; }
@keyframes tin { from { opacity: 0; transform: translateY(-10px) scale(.97); } to { opacity: 1; transform: none; } }
#modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 20px; background: rgba(2,3,8,.66); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.eco #modal { -webkit-backdrop-filter: none; backdrop-filter: none; }
.mbox { width: 100%; max-width: 420px; max-height: 86%; overflow: auto; padding: 18px; border-radius: 24px; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(155deg, rgba(50,54,76,.96), rgba(16,18,30,.97)); border: 1px solid var(--line2); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.mbox h2 { margin: 0; font-size: 20px; }
.mbox p { margin: 0; color: var(--ink2); }
.mbox .btns { justify-content: flex-end; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (max-height: 640px) { .stat b { font-size: 24px; } .quip { display: none; } .chip { padding: 5px 8px; } }
</style>

<div id="aura"></div>
<div id="app">
  <header class="hud glass" id="hud">
    <div class="hud-top">
      <div class="stat"><span class="lbl">Монеты</span><b id="coins">0</b></div>
      <div class="stat r"><span class="lbl">Глубина</span><b id="depth">0 м</b></div>
    </div>
    <div class="layerbar">
      <span class="dot"></span><span id="layerName">Дёрн</span>
      <div class="bar"><i id="layerFill"></i></div>
      <span id="layerNext"></span>
    </div>
    <div class="buffs" id="buffs"></div>
  </header>

  <main id="views">
    <section class="view on" id="v-dig">
      <div class="stage" id="stage">
        <div class="hint" id="hint">Тапай по блоку. Зажми палец, чтобы копать само.</div>
        <div class="blockwrap" id="blockwrap"><canvas id="block"></canvas></div>
        <div class="hpwrap">
          <div class="bar big"><i id="hpFill"></i></div>
          <div class="hprow"><span id="hpTxt"></span><span class="mut" id="hpSub"></span></div>
        </div>
        <div class="quip" id="quip"></div>
        <canvas id="fx"></canvas>
      </div>
      <div class="chips">
        <div class="chip glass"><span class="lbl">Тап</span><b id="chTap">1</b></div>
        <div class="chip glass"><span class="lbl">Авто / с</span><b id="chDps">0</b></div>
        <div class="chip glass"><span class="lbl">Крит</span><b id="chCrit">3%</b></div>
      </div>
      <div class="advice glass" id="advice">
        <div class="info"><span class="lbl">Выгодная покупка</span><div class="t" id="advName"></div><div class="bar"><i id="advFill"></i></div></div>
        <button class="buy" id="advBuy"><small>Купить</small><b id="advCost"></b></button>
      </div>
    </section>
    <section class="view" id="v-up"></section>
    <section class="view" id="v-team"></section>
    <section class="view" id="v-finds"></section>
    <section class="view" id="v-more"></section>
  </main>

  <nav id="tabs" class="glass" role="tablist">
    <button class="on" data-tab="dig" role="tab" aria-label="Копать"><svg viewBox="0 0 24 24"><path d="M4 20.5l9.5-9.5"/><path d="M8.2 6.2c3.6-2.6 9-1.2 11.1 3.6-3-1.8-6.6-2.2-9.6-.9z"/><path d="M13.5 11l2 2"/></svg>Копать</button>
    <button data-tab="up" role="tab" aria-label="Улучшения"><svg viewBox="0 0 24 24"><path d="M12 18.5V6"/><path d="M6.5 11.5L12 6l5.5 5.5"/><path d="M5.5 21h13"/></svg>Улучшения</button>
    <button data-tab="team" role="tab" aria-label="Команда"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.2 20c0-3.4 2.6-5.8 5.8-5.8s5.8 2.4 5.8 5.8"/><circle cx="17.2" cy="9" r="2.3"/><path d="M16.6 14.3c2.7.2 4.4 2.2 4.4 4.9"/></svg>Команда</button>
    <button data-tab="finds" role="tab" aria-label="Находки"><svg viewBox="0 0 24 24"><path d="M6.2 4h11.6l3.2 5L12 20.5 3 9z"/><path d="M3 9h18"/><path d="M9.4 4L8 9l4 11.5L16 9l-1.4-5"/></svg>Находки</button>
    <button data-tab="more" role="tab" aria-label="Ещё"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="1.6" fill="currentColor"/><circle cx="15" cy="12" r="1.6" fill="currentColor"/><circle cx="8" cy="17" r="1.6" fill="currentColor"/></svg>Ещё<i class="badge" id="moreBadge" hidden></i></button>
  </nav>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden></div>
<script>
/* ===== CORE: данные и логика игры, без DOM ===== */
const CORE = (() => {
'use strict';

const CFG = {
  hp0: 4, g: 1.033, kLayer: 1.2, loopCap: 4000, hcr: 1.16, powR: 1.15,
  findP: 0.2, tapRate: 2.5,
  gemStart: 200, gemDiv: 60, gemPow: 1.35, gemMin: 300,
  saveKey: 'raskop.save.v1'
};

const LAYERS = [
  { name: 'Дёрн',            start: 0,    hue: 96,  line: 'Ты копаешь землю. Карьера мечты.' },
  { name: 'Глина',           start: 30,   hue: 28,  line: 'Липнет к лопате и к самолюбию.' },
  { name: 'Камень',          start: 80,   hue: 214, line: 'Лопата в шоке. Ты — нет.' },
  { name: 'Уголь',           start: 150,  hue: 268, line: 'Светлее не стало, зато горючее есть.' },
  { name: 'Железо',          start: 240,  hue: 8,   line: 'Магнитится всё, кроме перспектив.' },
  { name: 'Медь',            start: 350,  hue: 168, line: 'Позеленела от зависти к золоту.' },
  { name: 'Золото',          start: 480,  hue: 46,  line: 'Блестит. Электричества это не добавляет.' },
  { name: 'Кристаллы',       start: 640,  hue: 190, line: 'Они светятся. Первый свет за сегодня.' },
  { name: 'Магма',           start: 830,  hue: 354, line: 'Тепло — тоже энергия. Утешай себя.' },
  { name: 'Грибной лес',     start: 1050, hue: 304, line: 'Светятся сами, без розетки. Завидуй.' },
  { name: 'Древние руины',   start: 1300, hue: 138, line: 'Здесь свет тоже когда-то отключили.' },

/* ---------- утилиты ---------- */
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'Ud', 'Dd', 'Td'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 1000) {
    if (n >= 100) return String(Math.floor(n));
    if (n >= 10) return String(Math.round(n * 10) / 10);
    return String(Math.round(n * 100) / 100);
  }
  let e = Math.floor(Math.log10(n) / 3);
  let v = n / Math.pow(10, e * 3);
  let t = v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2);
  if (parseFloat(t) >= 1000) { e++; v = n / Math.pow(10, e * 3); t = v.toFixed(2); }
  if (e >= SUF.length) return n.toExponential(2).replace('e+', 'e');
  return t + SUF[e];
}
function fmtTime(sec) {
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), x = sec % 60;
  if (h) return h + ' ч ' + m + ' мин';
  if (m) return m + ' мин ' + x + ' с';
  return x + ' с';
}

const KLf = L => Math.pow(CFG.kLayer, L);
const hpAt = d => CFG.hp0 * Math.pow(CFG.g, d);
function layerOf(d) {
  for (let i = LAYERS.length - 1; i > 0; i--) if (d >= LAYERS[i].start) return i;
  return 0;
}
function layerProgress(d) {
  const L = layerOf(d), a = LAYERS[L].start, b = LAYERS[L + 1] ? LAYERS[L + 1].start : null;
  return b === null ? 1 : (d - a) / (b - a);
}

/* ---------- состояние ---------- */
const EV = [];
function newState() {
  return {
    v: 1, coins: 0, depth: 0, hp: hpAt(0), tool: 0,
    up: { pow: 0, crit: 0, cdmg: 0, echo: 0, luck: 0 },
    helpers: HELPERS.map(() => 0),
    gems: 0, gemsTotal: 0, shop: {},
    finds: {}, ach: {},
    buffs: { dmgT: 0, dmgM: 1, coinT: 0, coinM: 1 },
    st: { taps: 0, crits: 0, blocks: 0, coinsAll: 0, coinsRun: 0, maxDepth: 0, runMax: 0, runs: 0, time: 0, runTime: 0, veins: 0, seenL: 0, hReveal: 1 },
    set: { eco: false, vib: true },
    saved: 0
  };
}
function sanitize(o) {
  const s = newState();
  if (!o || typeof o !== 'object') return s;
  for (const k of ['coins', 'depth', 'hp', 'tool', 'gems', 'gemsTotal', 'saved']) if (typeof o[k] === 'number' && isFinite(o[k])) s[k] = o[k];
  for (const k of ['up', 'shop', 'finds', 'ach', 'buffs', 'st', 'set']) if (o[k] && typeof o[k] === 'object') Object.assign(s[k], o[k]);
  if (Array.isArray(o.helpers)) o.helpers.forEach((n, i) => { if (i < s.helpers.length && isFinite(n)) s.helpers[i] = n; });
  s.tool = Math.min(Math.max(0, Math.floor(s.tool)), TOOLS.length - 1);
  s.depth = Math.max(0, Math.floor(s.depth));
  if (!(s.hp > 0) || s.hp > hpAt(s.depth) * 1.0001) s.hp = hpAt(s.depth);
  return s;
}

/* ---------- множители ---------- */
const shopLvl = (s, id) => s.shop[id] || 0;
const hCount = s => s.helpers.reduce((a, b) => a + b, 0);
const nFinds = s => Object.keys(s.finds).length;
const collBonus = s => nFinds(s) * 0.015;
const achBonus = s => Object.keys(s.ach).length * 0.01;
const dmgMult = s => (1 + 0.10 * s.gemsTotal) * (1 + 0.25 * shopLvl(s, 'force')) * (s.buffs.dmgT > 0 ? s.buffs.dmgM : 1);
const coinMult = s => (1 + collBonus(s) + achBonus(s)) * (1 + 0.25 * shopLvl(s, 'greed')) * (s.buffs.coinT > 0 ? s.buffs.coinM : 1);
const costMult = s => Math.pow(0.93, shopLvl(s, 'frugal'));
const msMult = n => { let m = 1; for (const t of MS) if (n >= t) m *= 2; return m; };
const nextMs = n => { for (const t of MS) if (n < t) return t; return null; };

function helperDps(s, i) { return s.helpers[i] * HELPERS[i].d * msMult(s.helpers[i]) * dmgMult(s); }
function autoDps(s) { let t = 0; for (let i = 0; i < HELPERS.length; i++) if (s.helpers[i]) t += helperDps(s, i); return t; }
function tapDmg(s) {
  return TOOLS[s.tool].mult * Math.pow(CFG.powR, s.up.pow) * dmgMult(s) + (0.01 + 0.004 * s.up.echo) * autoDps(s);
}
const critChance = s => Math.min(0.03 + 0.01 * s.up.crit, 0.6);
const critMult = s => 4 + 0.4 * s.up.cdmg;
const findChance = s => CFG.findP * (1 + 0.08 * s.up.luck) * (1 + 0.10 * shopLvl(s, 'lucky'));
const coinPerDmg = s => KLf(layerOf(s.depth)) * coinMult(s);
function eps(s) { return (autoDps(s) + tapDmg(s) * 2) * coinPerDmg(s); }
const maxOfflineSec = s => 7200 + 1800 * shopLvl(s, 'offline');
const offlineEff = s => Math.min(0.5 + 0.08 * shopLvl(s, 'offline'), 1);

/* ---------- цены ---------- */
const toolCost = s => s.tool + 1 < TOOLS.length ? TOOLS[s.tool + 1].cost * costMult(s) : Infinity;
const upCost = (s, id) => UPS[id].c0 * Math.pow(UPS[id].r, s.up[id]);
function helperCost(s, i, n) {
  const own = s.helpers[i];
  return HELPERS[i].c * Math.pow(CFG.hcr, own) * (Math.pow(CFG.hcr, n) - 1) / (CFG.hcr - 1) * costMult(s);
}
function helperMaxBuy(s, i) {
  const base = HELPERS[i].c * Math.pow(CFG.hcr, s.helpers[i]) * costMult(s);
  if (s.coins < base) return 0;
  return Math.max(0, Math.floor(Math.log(s.coins * (CFG.hcr - 1) / base + 1) / Math.log(CFG.hcr)));
}
const shopCost = (s, id) => Math.ceil(SHOP[id].c0 * Math.pow(SHOP[id].r, shopLvl(s, id)));

function buyTool(s) { const c = toolCost(s); if (s.coins < c) return false; s.coins -= c; s.tool++; return true; }
function buyUp(s, id) {
  if (s.up[id] >= UPS[id].max) return false;
  const c = upCost(s, id); if (s.coins < c) return false; s.coins -= c; s.up[id]++; return true;
}
function buyHelper(s, i, n) {
  if (n < 1) return false;
  const c = helperCost(s, i, n); if (s.coins < c) return false; s.coins -= c; s.helpers[i] += n; return true;
}
function buyShop(s, id) {
  if (shopLvl(s, id) >= SHOP[id].max) return false;
  const c = shopCost(s, id); if (s.gems < c) return false; s.gems -= c; s.shop[id] = shopLvl(s, id) + 1; return true;
}

/* ---------- оценка выгоды (подсказка и симулятор) ---------- */
function rate(s) {
  return CFG.tapRate * tapDmg(s) * (1 + critChance(s) * (critMult(s) - 1)) + autoDps(s);
}
function candidates(s) {
  const out = [], R0 = rate(s);
  if (s.tool + 1 < TOOLS.length) {
    const c = toolCost(s); s.tool++; const R = rate(s); s.tool--;
    out.push({ kind: 'tool', id: s.tool + 1, cost: c, gain: R - R0, name: TOOLS[s.tool + 1].name });
  }
  for (const id of ['pow', 'crit', 'cdmg', 'echo']) {
    if (s.up[id] >= UPS[id].max) continue;
    const c = upCost(s, id); s.up[id]++; const R = rate(s); s.up[id]--;
    out.push({ kind: 'up', id, cost: c, gain: R - R0, name: UPS[id].name });
  }
  for (let i = 0; i < HELPERS.length; i++) {
    const c = helperCost(s, i, 1); s.helpers[i]++; const R = rate(s); s.helpers[i]--;
    out.push({ kind: 'helper', id: i, cost: c, gain: R - R0, name: HELPERS[i].name });
  }
  return out.filter(x => x.gain > 0);
}
function bestCandidate(s) {
  let best = null, bv = -1;
  for (const c of candidates(s)) { const v = c.gain / c.cost; if (v > bv) { bv = v; best = c; } }
  return best;
}
function buyCandidate(s, c) {
  if (c.kind === 'tool') return buyTool(s);
  if (c.kind === 'up') return buyUp(s, c.id);
  return buyHelper(s, c.id, 1);
}

/* ---------- находки ---------- */
function rollFind(s) {
  if (Math.random() >= findChance(s)) return;
  const L = layerOf(s.depth);
  let x = Math.random() * 100, r = 0;
  for (; r < RAR.length - 1; r++) { x -= RAR[r].w; if (x < 0) break; }
  const id = L * 5 + r;
  const first = !s.finds[id];
  s.finds[id] = (s.finds[id] || 0) + 1;
  const coins = hpAt(s.depth) * coinPerDmg(s) * RAR[r].mult * (first ? 5 : 1);
  s.coins += coins; s.st.coinsAll += coins; s.st.coinsRun += coins;
  EV.push({ t: 'find', id, r, first, coins });
}

/* ---------- урон ---------- */
function applyDamage(s, dmg) {
  if (!(dmg > 0)) return 0;
  const cm = coinMult(s);
  let L = layerOf(s.depth), k = KLf(L) * cm, gained = 0, n = 0;
  while (dmg > 0) {
    if (dmg < s.hp) { s.hp -= dmg; gained += dmg * k; break; }
    dmg -= s.hp; gained += s.hp * k;
    s.depth++; s.st.blocks++;
    if (s.depth > s.st.runMax) s.st.runMax = s.depth;
    if (s.depth > s.st.maxDepth) s.st.maxDepth = s.depth;
    s.hp = hpAt(s.depth);
    const nL = layerOf(s.depth);
    if (nL !== L) { L = nL; k = KLf(L) * cm; EV.push({ t: 'layer', L }); }
    rollFind(s);
    if (++n >= CFG.loopCap) { gained += dmg * k; break; }
  }
  s.coins += gained; s.st.coinsAll += gained; s.st.coinsRun += gained;
  return gained;
}
function tap(s) {
  let d = tapDmg(s);

  s.buffs.dmgT = 0; s.buffs.coinT = 0;

/* ---------- новая шахта (престиж) ---------- */
function gemGain(s) {

  s.st.runMax = 0; s.st.coinsRun = 0; s.st.runTime = 0;
  EV.length = 0;

}

return {
  CFG, LAYERS, RAR, FINDS, TOOLS, HELPERS, UPS, UP_IDS, SHOP, SHOP_IDS, ACH, QUIPS, MS, EV,
  fmt, fmtTime, hpAt, layerOf, layerProgress, newState, sanitize,
  shopLvl, hCount, nFinds, collBonus, achBonus, dmgMult, coinMult, msMult, nextMs,

  toolCost, upCost, helperCost, helperMaxBuy, shopCost,

<script>
/* ===== UI ===== */
(() => {

/* ---------- элементы ---------- */
const stage = $('#stage'), wrap = $('#blockwrap'), blockCv = $('#block'), fxCv = $('#fx');

/* ---------- кнопка с удержанием ---------- */

/* ---------- тосты и окна ---------- */
const toastBox = $('#toasts');

/* ---------- блок ---------- */
let bsize = 240, bdpr = 1, fxW = 300, fxH = 300, drawnDepth = -1, drawnStage = -1, center = { x: 150, y: 150 };

/* ---------- эффекты ---------- */
let liveFl = 0, lastBreakFx = 0;
function floater(text, x, y, crit) {
  if (liveFl >= (S.set.eco ? 5 : 12)) return;
  const d = h('div', 'fl' + (crit ? ' crit' : ''), esc(text));
  d.style.left = x + 'px'; d.style.top = y + 'px'; stage.appendChild(d); liveFl++;
  const done = () => { d.remove(); liveFl--; };
  if (reduced || !d.animate) { setTimeout(done, 450); return; }

  const a = d.animate([
    { transform: 'translate(-50%,-50%) scale(.8)', opacity: 0 },
    { transform: 'translate(calc(-50% + ' + dx * .4 + 'px),-90%) scale(1.06)', opacity: 1, offset: .2 },
    { transform: 'translate(calc(-50% + ' + dx + 'px),-250%) scale(1)', opacity: 0 }

}
const parts = []; let fxRun = false;
function burst(n, x, y, hue) {
  if (S.set.eco || reduced) return;
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - .5) * 7, vy: -Math.random() * 5.5 - 1.5, life: 0, max: 28 + Math.random() * 22, s: 3 + Math.random() * 5, c: 'hsl(' + (hue + (Math.random() - .5) * 30) + ' 72% ' + (40 + Math.random() * 32) + '%)' });

}
function fxLoop() {
  const g = fxCtx; g.setTransform(bdpr, 0, 0, bdpr, 0, 0); g.clearRect(0, 0, fxW, fxH);
  for (let i = parts.length - 1; i >= 0; i--) {

}

  wrap.animate([{ transform: 'scale(1)' }, { transform: 'scale(' + (crit ? .93 : .965) + ') rotate(' + ((Math.random() - .5) * (crit ? 5 : 2.5)).toFixed(2) + 'deg)' }, { transform: 'scale(1)' }], { duration: crit ? 170 : 110, easing: 'ease-out' });

/* ---------- ввод на сцене ---------- */
function doTap(x, y) {
  const r = C.tap(S);
  floater(fmt(r.dmg), x + (Math.random() - .5) * 34, y - 12, r.crit);
  hitAnim(r.crit);
  if (r.broke) breakFx();
  if (r.crit) vib(14);

const ptrs = new Map();

stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.vein')) return;

  veinEl.addEventListener('pointerdown', e => {

function frame() {
  const now = Date.now(); let dt = (now - last) / 1000; last = now; if (dt < 0) dt = 0;
  if (dt > 3) { clearPtrs(); const r = C.offline(S, dt); if (r) showOffline(r); seenDepth = S.depth; findsDirty = true; }
  else C.step(S, dt);
  veinTick(dt); processEvents();
  if (S.depth > seenDepth) breakFx();
  seenDepth = S.depth;
  updHUD(); if (tab === 'dig') updStage();
  uiAt += dt; if (uiAt >= .25) { uiAt = 0; refreshTab(); updAdvice(); }
  saveAt += dt; if (saveAt >= 8) { saveAt = 0; save(); }
  quipAt -= dt; if (quipAt <= 0) { quipAt = 22; T(el.quip, C.QUIPS[Math.floor(Math.random() * C.QUIPS.length)]); }
}

/* ---------- запуск ---------- */
let booted = false;
function init(data) {
  if (booted) return; booted = true;
  try { const raw = data && data.save ? data.save : readSave(); if (raw) S = C.sanitize(JSON.parse(raw)); } catch (e) { S = C.newState(); }
  veinT = C.veinDelay(S) * .6;
  buildUp(); buildTeam();
  fullRefresh();
  const gap = S.saved ? (Date.now() - S.saved) / 1000 : 0;
  last = Date.now();
  if (gap > 20) { const r = C.offline(S, gap); if (r) showOffline(r); }
  seenDepth = S.depth; updHUD(); updStage(true); updAdvice();
  if (window.ResizeObserver) new ResizeObserver(layout).observe(stage); else window.addEventListener('resize', layout);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { clearPtrs(); save(); } });
  window.addEventListener('pagehide', () => { save(); });
  window.RASKOP = { state: () => S, core: C, setState: o => { S = C.sanitize(o); fullRefresh(); } };
}
try {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ save: JSON.stringify(S) }));
  if (hot && typeof hot.ready === 'function') { hot.ready(init); setTimeout(() => init({}), 1500); }
  else init((hot && hot.data) || {});
} catch (e) { init({}); }
})();

</script>
